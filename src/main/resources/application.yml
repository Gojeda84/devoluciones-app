server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devoluciones
    username: devoluciones_user
    password: devoluciones_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
